<script type="text/x-dc" data-dc-script data-props="{&quot;textAnim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;텍스트 연출&quot;},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;옐로우&quot;,&quot;코랄&quot;],&quot;default&quot;:&quot;옐로우&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;컬러&quot;},&quot;doorAnim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;스크롤 연출&quot;},&quot;doorLength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.4,&quot;min&quot;:1.6,&quot;max&quot;:4,&quot;step&quot;:0.2,&quot;unit&quot;:&quot;×화면&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;스크롤 연출&quot;}}">
class Component extends DCLogic {
  state = { tab: 'doc', menuOpen: false };
  scroller = React.createRef();

  componentDidMount() {
    this.onScroll = () => { if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.update(); }); };
    window.addEventListener('scroll', this.onScroll, true);
    window.addEventListener('resize', this.onScroll);
    const wait = () => { if (this.scroller.current) { this.update(); this.setupReveal(); } else this.waitRaf = requestAnimationFrame(wait); };
    wait();
  }
  componentDidUpdate() { this.update(); this.setupReveal(); }
  setupReveal() {
    const sc = this.scroller.current; if (!sc) return;
    const on = this.props.textAnim ?? true;
    const show = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; el.style.filter = 'none'; };
    if (!on) { if (this.io) { this.io.disconnect(); this.io = null; this.revealEls.forEach(show); } return; }
    if (this.io) return;
    const skip = [];
    const els = [...sc.querySelectorAll('h1 > span, h2, h3, p, #m-film span, footer > span, footer > div > span')]
      .filter(el => !skip.some(s => s && s.contains(el)) && !el.closest('button'));
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    els.forEach(el => {
      const big = el.closest('h1');
      el.style.opacity = '0';
      el.style.transform = big ? 'translateY(48px)' : 'translateY(20px)';
      el.style.filter = 'blur(6px)';
      el.style.transition = `opacity ${big ? 1 : .8}s ${ease}, transform ${big ? 1.1 : .8}s ${ease}, filter .8s ${ease}`;
      el.style.willChange = 'opacity, transform';
    });
    this.revealEls = els;
    this.io = new IntersectionObserver((entries) => {
      entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)
        .forEach((e, i) => {
          const el = e.target, d = Math.min(i, 6) * (el.closest('h1') ? 140 : 90);
          el.style.transitionDelay = d + 'ms';
          show(el);
          setTimeout(() => { el.style.transitionDelay = '0ms'; el.style.willChange = 'auto'; }, d + 1200);
          this.io.unobserve(el);
        });
    }, { root: sc, threshold: 0.01, rootMargin: '0px' });
    els.forEach(el => this.io.observe(el));
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll, true);
    window.removeEventListener('resize', this.onScroll);
    cancelAnimationFrame(this.waitRaf);
    if (this.io) this.io.disconnect();
  }
  update() {}
  applyPalette() {
    const y = (this.props.palette ?? '옐로우') === '옐로우', r = document.documentElement.style;
    r.setProperty('--hs-floor', y ? '#F6DF8F' : '#F4B9AC');
    r.setProperty('--color-accent', y ? 'oklch(0.9 0.1 92)' : 'oklch(0.8 0.085 30)');
    r.setProperty('--color-accent-600', y ? 'oklch(0.84 0.11 90)' : 'oklch(0.74 0.095 30)');
    r.setProperty('--color-accent-700', y ? 'oklch(0.5 0.1 75)' : 'oklch(0.5 0.1 30)');
  }
  staggerLines(root, p) {
    const lines = [root.querySelector('img'), ...root.querySelectorAll('h2 > span')].filter(Boolean);
    lines.forEach((el, i) => {
      const t = Math.min(1, Math.max(0, (p - 0.4 - i * 0.1) / 0.3));
      const k = 1 - Math.pow(1 - t, 3);
      el.style.display = el.tagName === 'IMG' ? 'block' : 'block';
      el.style.opacity = k;
      el.style.transform = `translateY(${(1 - k) * 24}px)`;
      el.style.filter = `blur(${(1 - k) * 6}px)`;
    });
  }
  renderVals() {
    const t = this.state.tab;
    this.applyPalette();
    const sfx = (this.props.palette ?? '옐로우') === '옐로우' ? '-y' : '';
    return {
      heroVideo: (el) => { if (el) { el.muted = true; el.defaultMuted = true; el.volume = 0; el.loop = true; el.setAttribute('muted', ''); el.play && el.play().catch(() => {}); } },
      introVideo: (el) => {
        if (!el || el._io) return;
        el.muted = true; el.defaultMuted = true; el.volume = 0; el.loop = true; el.setAttribute('muted', ''); el.pause();
        let started = false;
        el._io = new IntersectionObserver(([en]) => {
          if (en.isIntersecting) { if (!started) { el.currentTime = 0; started = true; } el.play().catch(() => {}); }
          else el.pause();
        }, { root: this.scroller.current, threshold: 0.25 });
        el._io.observe(el);
      },
      reelVideo: (el) => { if (!el || el.__io) return; el.muted = true; el.defaultMuted = true; el.volume = 0; el.loop = true; el.setAttribute('muted', ''); el.setAttribute('playsinline', ''); el.__io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.play && el.play().catch(() => {}); } else { el.pause && el.pause(); } }, { threshold: 0.01, rootMargin: '200px 0px' }); el.__io.observe(el); },
      replayHero: (e) => { const v = e.currentTarget; v.currentTime = 0; v.play().catch(() => {}); },
      heroSrc: 'images/hansang-hero' + sfx + '.svg', gHansang: 'images/group2-hansang' + sfx + '.svg', gFnb: 'images/group2-fnb' + sfx + '.svg', gFilm: 'images/group3-film' + sfx + '.svg',
      scroller: this.scroller,
      isDoc: t === 'doc', isReels: t === 'reels', isPhoto: t === 'photo', isPoster: t === 'poster',
      pickTab: (e) => this.setState({ tab: e.target.value }),
      slideOne: (e) => {
        const t = e.currentTarget, el = document.getElementById(t.dataset.target);
        if (!el) return;
        const w = el.clientWidth, n = el.children.length, cur = Math.round(el.scrollLeft / w);
        const next = (cur + Number(t.dataset.dir) + n) % n;
        el.scrollTo({ left: next * w, behavior: 'smooth' });
      },
      menuOpen: this.state.menuOpen,
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
      go: (e) => {
        e.preventDefault();
        const id = e.currentTarget.dataset.to, sc = this.scroller.current, el = document.getElementById(id);
        this.setState({ menuOpen: false });
        if (sc && el) sc.scrollTo({ top: el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 54, behavior: 'smooth' });
      }
    };
  }
}
</script>
</body>
</html>
